# Edu Mentor AI — Full Stack Docker Compose
# Start Qdrant only:  docker compose -f docker/docker-compose.yml up -d
# Full stack:         docker compose -f docker/docker-compose.yml --profile full up -d

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: edu-mentor-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: edu-mentor-postgres
    environment:
      POSTGRES_USER: edu_mentor
      POSTGRES_PASSWORD: edu_mentor_dev
      POSTGRES_DB: edu_mentor_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - full

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: edu-mentor-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data/models:/app/data/models
    depends_on:
      - qdrant
    profiles:
      - full

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: edu-mentor-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    profiles:
      - full

volumes:
  qdrant_data:
  postgres_data:
